<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>chine-web: diamond</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #15161a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      chine-spine {
        display: block;
        width: 80vw;
        height: 80vh;
        max-width: 1100px;
        max-height: 850px;
      }
    </style>
  </head>
  <body>
    <!-- The diamond rig (binary .skel + sequence/flipbook attachments),
         rendered by chine compiled to WebAssembly + a WebGL2 backend. -->
    <chine-spine
      atlas="diamond-pro.atlas"
      skeleton="diamond-pro.skel"
      animation="idle-rotating"
    ></chine-spine>
    <script type="module" src="../js/chine-spine.js"></script>
  </body>
</html>
