[package]
name = "chine-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly + WebGL2 web-component runtime for the chine Spine 4.3 runtime."
repository = "https://github.com/Oneiriq/chine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Also load `.json` skeleton exports (pulls in serde_json, which enlarges the
# wasm). Off by default for a smaller binary-only viewer; most Spine HTML
# exports are binary `.skel`.
json = ["chine/json"]

[dependencies]
chine = { path = "..", default-features = false, features = ["binary"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
]
