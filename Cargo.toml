[package]
name = "chine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A pure-Rust Spine 4.3 skeletal animation runtime (renderer-agnostic)."
repository = "https://github.com/Oneiriq/chine"
keywords = ["spine", "animation", "skeletal", "2d", "gamedev"]
categories = ["game-development", "graphics"]

[workspace]
members = ["chine-web"]
resolver = "2"

[features]
default = ["json", "binary"]
# Load `.json` skeleton exports.
json = ["dep:serde", "dep:serde_json"]
# Load `.skel` binary skeleton exports (no extra dependencies).
binary = []

[dependencies]
glam = "0.33"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints.rust]
# `skel_fixtures` is set by build.rs when the gitignored Spine rigs are present.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(skel_fixtures)'] }

# The inspect example loads a `.json` export, so it needs the `json` feature.
[[example]]
name = "inspect"
required-features = ["json"]
